- name: Install packages
  become: true
  pacman:
    name:
      - bash-completion
    state: present

- name: Deploy .inputrc
  become: true
  copy:
    src: files/inputrc
    dest: "{{ item.home }}/.inputrc"
    mode: '0644'
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
  loop:
    - { home: "{{ home }}", user: "{{ username }}" }
    - { home: "/root", user: root }

- name: Deploy .bashrc
  copy:
    src: files/bashrc
    dest: "{{ home }}/.bashrc"
    mode: '0644'

- name: Create .bashrc.d directory
  file:
    path: "{{ home }}/.bashrc.d"
    state: directory
    mode: '0755'

- name: Copy .bashrc.d drop-in files
  copy:
    src: files/bashrc.d/
    dest: "{{ home }}/.bashrc.d/"
    mode: '0644'

- name: Copy root .bash_profile
  become: true
  copy:
    src: files/bashrc.d/aliases
    dest: "/root/.bash_profile"
    mode: '0644'
    owner: root
    group: root

- name: Check pkgfile's cache age
  stat:
    path: /var/cache/pkgfile/.db_version
  register: pkgfile_stat

- name: Update pkgfile only if cache is older than 7 days
  become: true
  command: pkgfile -u
  when: >
    not pkgfile_stat.stat.exists or 
    (ansible_facts['date_time']['epoch'] | int) - (pkgfile_stat.stat.mtime | int) > 2592000
