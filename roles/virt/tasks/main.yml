- name: Install packages
  become: true
  pacman:
    name:
      - libvirt
      - edk2-ovmf
      - dnsmasq
      - virt-manager
      - qemu-full
      - vulkan-virtio


- name: enable libvirt systemd service
  become: true
  ansible.builtin.systemd_service:
    enabled: true
    name: "{{ item }}"
  loop:
    - libvirtd.service
  notify: Systemd reload
